name: Verify research artifact
on:
  push:
    branches: [main, public-release-ercemapi2026]
  pull_request:

jobs:
  quick-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r environment/requirements-core.txt
      - name: Verify hashes, textual integrity, and predictions
        run: bash scripts/run.sh quick
